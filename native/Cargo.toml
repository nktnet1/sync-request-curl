[package]
name = "sync-request-curl-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "sync_request_curl_native"
crate-type = ["cdylib"]

[features]
default = ["bundled-curl-http3"]
bundled-curl-base = ["curl-sys/http2", "curl-sys/static-curl", "curl-sys/apple-sectrust"]
bundled-curl = ["bundled-curl-base", "curl-sys/ssl", "curl-sys/static-ssl"]
bundled-curl-http3 = ["bundled-curl-base", "curl-sys/http3"]
system-curl = ["curl-sys/force-system-lib-on-osx"]
# Cargo unit tests run without a Node host; never enable this for addon builds.
test-noop = ["napi/noop", "napi-derive/noop"]

[dependencies]
napi = { version = "=3.13.0", default-features = false, features = ["dyn-symbols", "napi8"] }
napi-derive = "=3.6.3"
# Keep the macro crate on the backend release it was published against.
# napi-derive-backend 6.1.4 moved to convert_case 0.12 while napi-derive 3.6.3 still uses 0.11.
napi-derive-backend = "=6.1.2"
curl-sys = { package = "nktnet-curl-sys", version = "=0.4.91-nktnet.2", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
openssl-probe = "=0.2.1"

[build-dependencies]
napi-build = "=2.5.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
