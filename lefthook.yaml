pre-commit:
  commands:
    docs:
      glob:
        - "README.md"
        - "package.json"
        - "tsconfig.json"
        - "src/*.ts"
        - "src/**/*.ts"
        - "typedoc/*.ts"
        - "typedoc/**/*.ts"
        - "typedoc/assets/*.md"
      run: >
        pnpm docs:gen
        && git add README.md
    typecheck:
      glob: "*.{ts,cts,mts}"
      run: >
        pnpm typecheck
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: >
        pnpm check
        --error-on-warnings
        --no-errors-on-unmatched
        --files-ignore-unknown=true
        {staged_files}
