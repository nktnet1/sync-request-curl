name: Pipeline

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**/README.md'

jobs:
  native:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: ubuntu-latest
            platform: linux-x64-gnu
            kind: linux
            libc: gnu
          - runner: ubuntu-24.04
            artifact: alpine-latest
            platform: linux-x64-musl
            kind: linux
            libc: musl
          - runner: macos-15
            artifact: macos-latest
            platform: darwin-arm64
            kind: desktop
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Build Linux prebuild
        if: matrix.kind == 'linux'
        run: node scripts/linux-prebuild.ts --libc=${{ matrix.libc }} --mode=build

      - name: Set up Rust
        if: matrix.kind == 'desktop'
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update

      - name: Build native addon
        if: matrix.kind == 'desktop'
        run: node scripts/build-native.ts

      - name: Stage native addon
        if: matrix.kind == 'desktop'
        run: node scripts/stage-native.ts --platform=${{ matrix.platform }}

      - name: Verify native addon loads
        if: matrix.kind == 'desktop'
        run: node scripts/verify-native-load.ts --file=prebuilds/sync_request_curl_native.${{ matrix.platform }}.node

      - name: Upload native addon
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.artifact }}
          path: prebuilds/sync_request_curl_native.${{ matrix.platform }}.node
          if-no-files-found: error

  test:
    needs: native
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node-version:
          - 22.x
          - 24.x
          - 26.x
      fail-fast: true
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable pnpm via corepack
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native addon
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: prebuilds

      - name: Run lint and format
        if: matrix.os == 'ubuntu-latest'
        run: pnpm check

      - name: Run typecheck
        if: matrix.os == 'ubuntu-latest'
        run: pnpm typecheck

      - name: Build package
        if: matrix.os == 'ubuntu-latest'
        run: pnpm build

      - name: Run tests with coverage
        run: pnpm test --coverage

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && github.ref_name == 'main'
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-musl:
    needs: native
    strategy:
      matrix:
        node-version:
          - '22'
          - '24'
          - '26'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Download Alpine native addon
        uses: actions/download-artifact@v4
        with:
          name: native-alpine-latest
          path: prebuilds

      - name: Test on Alpine
        run: node scripts/linux-prebuild.ts --libc=musl --mode=test --node=${{ matrix.node-version }}
