name: Publish

on:
  workflow_run:
    workflows:
      - Native prebuilds
    types:
      - completed

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download release prebuilds
        uses: actions/download-artifact@v4
        with:
          name: native-prebuilds
          path: prebuilds
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-metadata
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Enable pnpm via corepack
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG="$(cat release-metadata/tag)"
          SHA="$(cat release-metadata/sha)"
          PACKAGE_TAG="v$(node -p "require('./package.json').version")"
          TAG_SHA="$(git rev-list -n 1 "$TAG")"

          test "$TAG" = "$PACKAGE_TAG"
          test "$SHA" = "$BUILD_SHA"
          test "$TAG_SHA" = "$BUILD_SHA"

      - name: Publish package with trusted publishing
        run: npm publish
