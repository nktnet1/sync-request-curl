name: Native prebuilds

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64-gnu
            libc: gnu
          - runner: ubuntu-24.04
            platform: linux-x64-musl
            libc: musl
          - runner: ubuntu-24.04-arm
            platform: linux-arm64-gnu
            libc: gnu
          - runner: ubuntu-24.04-arm
            platform: linux-arm64-musl
            libc: musl
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Build Linux prebuild
        run: node scripts/linux-prebuild.ts --libc=${{ matrix.libc }} --mode=build

      - name: Upload native addon
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}
          path: prebuilds/sync_request_curl_native.${{ matrix.platform }}.node
          if-no-files-found: error
          retention-days: 1

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: windows-2025
            platform: win32-x64-msvc
          - runner: windows-11-arm
            platform: win32-arm64-msvc
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Set up Rust
        run: rustup toolchain install "$(node scripts/rust-toolchain.ts)" --profile minimal --no-self-update

      - name: Set up NASM for Windows x64
        if: matrix.platform == 'win32-x64-msvc'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Build native addon
        run: node scripts/build-native.ts

      - name: Stage native addon
        run: node scripts/stage-native.ts --platform=${{ matrix.platform }}

      - name: Verify native addon loads
        run: node scripts/verify-native-load.ts --file=prebuilds/sync_request_curl_native.${{ matrix.platform }}.node

      - name: Upload native addon
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}
          path: prebuilds/sync_request_curl_native.${{ matrix.platform }}.node
          if-no-files-found: error
          retention-days: 1

  build-windows-x86:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          architecture: x86
      - name: Set up Rust and x86 target
        run: |
          $toolchain = node scripts/rust-toolchain.ts
          rustup toolchain install $toolchain --profile minimal --no-self-update
          rustup target add i686-pc-windows-msvc --toolchain $toolchain
      - name: Set up NASM for Windows x86
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Verify bundled HTTP/3 capability on Windows x86
        env:
          LIBZ_SYS_STATIC: "1"
          OPENSSL_STATIC: "1"
          PKG_CONFIG_ALL_STATIC: "1"
        run: >-
          cargo test --locked --manifest-path native/Cargo.toml --release
          --target i686-pc-windows-msvc --lib --no-default-features
          --features bundled-curl-http3,test-noop
      - name: Build and verify with 32-bit Node.js
        run: node native/build.ts
      - name: Stage native addon
        run: Copy-Item native/build/sync_request_curl_native.node prebuilds/sync_request_curl_native.win32-ia32-msvc.node
      - name: Verify native addon loads
        run: node scripts/verify-native-load.ts --file=prebuilds/sync_request_curl_native.win32-ia32-msvc.node
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-win32-ia32-msvc
          path: prebuilds/sync_request_curl_native.win32-ia32-msvc.node
          if-no-files-found: error
          retention-days: 1

  build-freebsd:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: freebsd-x64
            arch: x86_64
          - platform: freebsd-arm64
            arch: aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and verify ${{ matrix.platform }}
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        with:
          release: "14.4"
          arch: ${{ matrix.arch }}
          mem: 8192
          usesh: true
          # Use the pinned FreeBSD setup script on each release run.
          prepare: |
            # ${{ hashFiles('scripts/freebsd-ci.sh', 'rust-toolchain.toml') }}
            sh scripts/freebsd-ci.sh prepare
          # Run the complete FreeBSD build and smoke checks for this release.
          run: sh scripts/freebsd-ci.sh build ${{ matrix.platform }}

      - name: Confirm native addon was copied back
        run: test -s prebuilds/sync_request_curl_native.${{ matrix.platform }}.node

      - name: Upload native addon
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}
          path: prebuilds/sync_request_curl_native.${{ matrix.platform }}.node
          if-no-files-found: error
          retention-days: 1

  collect:
    needs:
      - build-freebsd
      - build-linux
      - build-desktop
      - build-windows-x86
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download native addons
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: prebuilds
          merge-multiple: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Verify release matrix
        run: node scripts/verify-prebuilds.ts

      - name: Upload release prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: native-prebuilds
          path: prebuilds/*.node
          if-no-files-found: error
          retention-days: 1

      - name: Write release metadata
        run: |
          mkdir -p release-metadata
          printf '%s\n' "$GITHUB_REF_NAME" > release-metadata/tag
          printf '%s\n' "$GITHUB_SHA" > release-metadata/sha

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata
          if-no-files-found: error
          retention-days: 7

  package:
    needs: collect
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable pnpm via corepack
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release prebuilds
        uses: actions/download-artifact@v4
        with:
          name: native-prebuilds
          path: prebuilds

      - name: Verify release matrix
        run: node scripts/verify-prebuilds.ts

      - name: Build JavaScript package
        run: pnpm build

      - name: Prepare release packages
        run: pnpm prepare:release-packages

      - name: Pack release packages
        run: |
          mkdir -p release-tarballs
          for package_dir in .release/native/*; do
            npm pack "$package_dir" --pack-destination release-tarballs --ignore-scripts
          done
          npm pack .release/main --pack-destination release-tarballs --ignore-scripts
          test "$(find release-tarballs -maxdepth 1 -name '*.tgz' -type f | wc -l)" -eq 12

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
